<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorelSys - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
            
        }

        :root {
            --bg: #071F45;
            --primary: #0F4C81;
            --primary-dark: #0B3A61;
            --circle-big: #1E88E5;
            --circle-small: #0D47A1;
            --white: #FFFFFF;
            --text: #1E293B;
            --text-light: #64748B;
            --border: #C9D2DC;

        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(90deg, #07152D, #102B57, #07152D);

        }

        /* CARD */

        .login-card {
            position: relative;
            width: 560px;
            height: 320px;
            background: white;
            display: flex;
            justify-content: space-between;
            padding: 25px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .25);

        }

        .bottom-image {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            opacity: .9;
            pointer-events: none;
            z-index: 1;

        }

        /* ESQUERDA */

        .left {
            width: 230px;
            position: relative;
            z-index: 2;

        }

        .logo {
            width: 120px;
            height: 45px;
            background: var(--primary);
            color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;

        }

        .logo span {
            transform: translateY(-1px);
        }

        h1 {
            font-size: 20px;
            color: var(--text);
            margin-bottom: 15px;

        }

        .info {
            font-size: 12px;
            color: #6B7280;
            line-height: 1.5;

        }

        .info strong {
            display: block;
            color: #111827;
            font-size: 13px;
            font-weight: 600;

        }

        /* DIREITA */

        .right {
            width: 220px;
            position: relative;
            z-index: 2;

        }

        .form-group {
            margin-bottom: 10px;

        }

        label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            color: #374151;

        }

        input[type=email],
        input[type=password] {
            width: 100%;
            height: 25px;
            border: 1px solid var(--border);
            outline: none;
            border-radius: 4px;
            padding: 0 8px;
            font-size: 12px;

        }

        input[type=email]:focus,
        input[type=password]:focus {
            border-color: var(--primary);

        }

        .remember {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 6px;
            margin-bottom: 10px;
            font-size: 11px;
            color: #6B7280;

        }

        .actions {
            display: flex;
            gap: 8px;

        }

        .btn {
            width: 110px;
            height: 26px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: .2s;

        }

        .btn-primary {
            background: var(--primary);
            color: rgb(255, 255, 255);

        }

        .btn-primary:hover {
            background: var(--primary-dark);

        }

        .btn-secondary {
            background: #D8D8D8;
            color: #333;

        }

        .btn-secondary:hover {
            background: #C7C7C7;

        }

        /* LICENÇA */

        .license {
            position: absolute;
            right: 25px;
            bottom: 45px;
            font-size: 11px;
            color: #555;
            text-align: left;
            line-height: 1.4;

        }

        .license strong {
            display: block;
            margin-top: 3px;
            color: #222;

        }

        /* COPYRIGHT */

        .footer {
            position: absolute;
            right: 25px;
            bottom: 18px;
            font-size: 10px;
            color: #777;

        }

        .footer a {
            color: var(--primary);
            text-decoration: none;

        }

        .footer a:hover {
            text-decoration: underline;

        }

        /* RESPONSIVO */

        @media(max-width:650px) {
            .login-card {
                width: 95%;
                height: auto;
                flex-direction: column;
                gap: 25px;
                padding: 25px;

            }

            .left,
            .right {
                width: 100%;

            }

            .license,
            .footer {
                position: static;
                margin-top: 15px;

            }

        }

        .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,.3);
    border-top: 2px solid #fff;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    100% {
        transform: rotate(360deg);
    }
}
    </style>
</head>

<body>
    <div class="login-card">
        <div class="left">
            <div class="logo">
                <span>CorelSys</span>
            </div>
            <h1>ERP_Empresarial</h1>
            <div class="info">
                Software licenciado para:
                <strong>Empresa Cliente</strong>
            </div>
        </div>

        <img src="/assets/img/login.png" alt="Ilustração ERP" class="bottom-image">

        <div class="right">

            <form id="loginForm">

                <div class="form-group">
                    <label>Usuário:</label>

                    <input type="email" id="text" required>
                </div>

                <div class="form-group">
                    <label>Senha:</label>

                    <input type="password" id="senha" required>
                </div>

                <div class="remember">

                    <input type="checkbox" id="remember">

                    <label for="remember" style="margin:0;">
                        Lembrar-me
                    </label>

                </div>

                <div class="actions">

                    <button type="submit" class="btn btn-primary">
                        Entrar
                    </button>

                    <button type="button" class="btn btn-secondary" onclick="limparCampos()">
                        Fechar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('text').value;
    const password = document.getElementById('senha').value;

    const loginBtn = document.querySelector('.btn-primary');

    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="spinner"></span>';

    try {
        const result = await authService.login(email, password);

        if (result.success) {

            notificationsService.success(
                'Login realizado com sucesso!'
            );

            setTimeout(() => {
                window.location.href =
                    '../dashboard/index.html';
            }, 1000);

        } else {
            throw new Error();
        }

    } catch (error) {

        notificationsService.error(
            'Credenciais inválidas. Tente novamente.'
        );

        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span>Entrar</span>';
    }
});

// Verifica se já está logado
if (
    typeof authService !== 'undefined' &&
    authService.isAuthenticated()
) {
    window.location.href = '../dashboard/index.html';
}
</script>

</body>

</html>
