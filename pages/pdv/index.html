<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV - ERP Restaurant</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/components/sidebar.css">
    <link rel="stylesheet" href="../../assets/css/components/navbar.css">
    <link rel="stylesheet" href="../../assets/css/components/cards.css">
    <link rel="stylesheet" href="../../assets/css/components/modals.css">
    <style>
        .main-content {
            margin-left: 260px;
            margin-top: 64px;
            padding: 24px;
            min-height: calc(100vh - 64px);
            transition: var(--transition);
        }

        .sidebar.collapsed ~ .main-content {
            margin-left: 70px;
        }

        .pdv-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 24px;
            height: calc(100vh - 120px);
        }

        .pdv-left {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .pdv-right {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .categories {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .category-btn {
            padding: 12px 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .category-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .category-btn.active {
            background: var(--primary);
            color: #FFFFFF;
            border-color: var(--primary);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            overflow-y: auto;
            flex: 1;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            cursor: pointer;
            transition: var(--transition);
        }

        .product-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .product-image {
            width: 100%;
            height: 120px;
            background: var(--bg-hover);
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image svg {
            width: 48px;
            height: 48px;
            color: var(--text-muted);
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .order-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .order-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .order-items {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .order-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            margin-bottom: 8px;
        }

        .order-item-info {
            flex: 1;
        }

        .order-item-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .order-item-price {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .order-item-quantity {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quantity-btn {
            width: 28px;
            height: 28px;
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .quantity-btn:hover {
            background: var(--primary);
            color: #FFFFFF;
        }

        .order-item-total {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            min-width: 80px;
            text-align: right;
        }

        .order-footer {
            padding: 20px;
            border-top: 1px solid var(--border);
        }

        .order-summary {
            margin-bottom: 16px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .summary-row.total {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            border-top: 1px solid var(--border);
            margin-top: 8px;
            padding-top: 16px;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .payment-btn {
            padding: 16px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .payment-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .payment-btn.active {
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
        }

        .payment-btn svg {
            width: 24px;
            height: 24px;
        }

        .payment-btn span {
            font-size: 12px;
            font-weight: 500;
        }

        .finish-btn {
            width: 100%;
            padding: 16px;
            background: var(--success);
            color: #FFFFFF;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .finish-btn:hover {
            background: #16A34A;
        }

        .finish-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 1024px) {
            .main-content {
                margin-left: 0;
                padding: 16px;
            }

            .sidebar.collapsed ~ .main-content {
                margin-left: 0;
            }

            .pdv-container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .pdv-right {
                position: fixed;
                top: 64px;
                right: 0;
                width: 400px;
                height: calc(100vh - 64px);
                z-index: 1000;
                transform: translateX(100%);
                transition: var(--transition);
            }

            .pdv-right.open {
                transform: translateX(0);
            }
        }

        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }

            .pdv-right {
                width: 100%;
            }

            .payment-methods {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>

    <script>
        // Check authentication
        if (!authService.isAuthenticated()) {
            window.location.href = '../login/index.html';
        }

        // Load user info
        const user = authService.getCurrentUser();
        if (user) {
            document.getElementById('userAvatar').textContent = user.avatar || 'AU';
            document.getElementById('userName').textContent = user.name || 'Admin User';
            document.getElementById('navUserAvatar').textContent = user.avatar || 'AU';
            document.getElementById('navUserName').textContent = user.name || 'Admin User';
        }

        // Mock products data
        const products = [
            { id: 1, name: 'X-Burger', category: 'lanches', price: 25.00 },
            { id: 2, name: 'X-Salada', category: 'lanches', price: 28.00 },
            { id: 3, name: 'X-Bacon', category: 'lanches', price: 32.00 },
            { id: 4, name: 'Coca-Cola 350ml', category: 'bebidas', price: 6.00 },
            { id: 5, name: 'Suco de Laranja', category: 'bebidas', price: 8.00 },
            { id: 6, name: 'Água Mineral', category: 'bebidas', price: 4.00 },
            { id: 7, name: 'Batata Frita', category: 'lanches', price: 15.00 },
            { id: 8, name: 'Pudim', category: 'sobremesas', price: 12.00 },
            { id: 9, name: 'Sorvete', category: 'sobremesas', price: 10.00 },
            { id: 10, name: 'Feijoada', category: 'pratos', price: 45.00 },
            { id: 11, name: 'Frango Grelhado', category: 'pratos', price: 38.00 },
            { id: 12, name: 'Refrigerante 2L', category: 'bebidas', price: 12.00 }
        ];

        let order = [];
        let selectedCategory = 'all';
        let selectedPaymentMethod = 'pix';

        // Render products grid
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const filteredProducts = selectedCategory === 'all' 
                ? products 
                : products.filter(p => p.category === selectedCategory);

            grid.innerHTML = filteredProducts.map(product => `
                <div class="product-card" onclick="addToOrder(${product.id})">
                    <div class="product-image">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">R$ ${product.price.toFixed(2)}</div>
                </div>
            `).join('');
        }

        // Render order items
        function renderOrder() {
            const container = document.getElementById('orderItems');
            
            if (order.length === 0) {
                container.innerHTML = `
                    <div class="table-empty">
                        <div class="table-empty-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                            </svg>
                        </div>
                        <div class="table-empty-title">Pedido vazio</div>
                        <div class="table-empty-description">Adicione produtos para iniciar o pedido</div>
                    </div>
                `;
                document.getElementById('finishBtn').disabled = true;
            } else {
                container.innerHTML = order.map(item => `
                    <div class="order-item">
                        <div class="order-item-info">
                            <div class="order-item-name">${item.name}</div>
                            <div class="order-item-price">R$ ${item.price.toFixed(2)} un.</div>
                        </div>
                        <div class="order-item-quantity">
                            <button class="quantity-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button class="quantity-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                        </div>
                        <div class="order-item-total">R$ ${(item.price * item.quantity).toFixed(2)}</div>
                    </div>
                `).join('');
                document.getElementById('finishBtn').disabled = false;
            }

            updateSummary();
        }

        // Update order summary
        function updateSummary() {
            const subtotal = order.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const discount = 0;
            const total = subtotal - discount;

            document.getElementById('subtotal').textContent = `R$ ${subtotal.toFixed(2)}`;
            document.getElementById('discount').textContent = `R$ ${discount.toFixed(2)}`;
            document.getElementById('total').textContent = `R$ ${total.toFixed(2)}`;
        }

        // Add to order
        window.addToOrder = function(productId) {
            const product = products.find(p => p.id === productId);
            if (product) {
                const existingItem = order.find(item => item.id === productId);
                if (existingItem) {
                    existingItem.quantity++;
                } else {
                    order.push({ ...product, quantity: 1 });
                }
                renderOrder();
            }
        };

        // Update quantity
        window.updateQuantity = function(productId, change) {
            const item = order.find(i => i.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    order = order.filter(i => i.id !== productId);
                }
                renderOrder();
            }
        };

        // Category filter
        document.getElementById('categories').addEventListener('click', (e) => {
            if (e.target.classList.contains('category-btn')) {
                document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                selectedCategory = e.target.dataset.category;
                renderProducts();
            }
        });

        // Payment method selection
        document.querySelectorAll('.payment-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.payment-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedPaymentMethod = btn.dataset.method;
            });
        });

        // Clear order
        document.getElementById('clearOrderBtn').addEventListener('click', () => {
            if (order.length > 0) {
                order = [];
                renderOrder();
                notificationsService.info('Pedido limpo');
            }
        });

        // Finish sale
        document.getElementById('finishBtn').addEventListener('click', () => {
            if (order.length > 0) {
                const total = order.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                notificationsService.success(`Venda finalizada! Total: R$ ${total.toFixed(2)} - Pagamento: ${selectedPaymentMethod.toUpperCase()}`);
                order = [];
                renderOrder();
            }
        });

        // Sidebar toggle
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const menuBtn = document.getElementById('menuBtn');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });

        menuBtn.addEventListener('click', () => {
            if (window.innerWidth <= 1024) {
                sidebar.classList.toggle('open');
            } else {
                sidebar.classList.toggle('collapsed');
            }
        });

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const currentTheme = storageService.get('theme', 'dark');
        document.documentElement.setAttribute('data-theme', currentTheme);

        themeToggle.addEventListener('click', () => {
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            storageService.set('theme', newTheme);
            location.reload();
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await authService.logout();
            window.location.href = '../login/index.html';
        });

        // Initial render
        renderProducts();
        renderOrder();
    </script>
</body>
</html>
